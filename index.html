<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f0f11;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Rack Modül Kasası */
        .rack-panel {
            background: linear-gradient(145deg, #222428, #16171a);
            border: 2px solid #2d3036;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Dijital Frekans Ekranı */
        .display {
            background-color: #08090a;
            border: 1px solid #22252a;
            border-radius: 12px;
            width: 100%;
            padding: 18px 10px;
            text-align: center;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9);
        }

        .freq-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ff3b30;
            text-shadow: 0 0 12px rgba(255, 59, 48, 0.4);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -1px;
        }

        .unit {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ana Kadran (Knob) */
        .knob-container {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        .knob-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2d32 50%, #151619 100%);
            border: 4px solid #34383f;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            position: relative;
            cursor: ns-resize;
        }

        .knob-dial {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            transform: rotate(-135deg);
            transition: transform 0.04s linear;
        }

        /* Kırmızı İbre */
        .pointer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 30px;
            background-color: #ff3b30;
            border-radius: 2px;
            box-shadow: 0 0 10px #ff3b30;
        }

        .knob-center {
            position: absolute;
            width: 58%;
            height: 58%;
            background: linear-gradient(145deg, #1c1e21, #282b30);
            border-radius: 50%;
            border: 1px solid #3e424a;
            pointer-events: none;
        }

        /* Vites / Kademe Butonları */
        .gear-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
        }

        .gear-buttons {
            display: flex;
            background: #0d0e10;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #22252a;
        }

        .gear-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: #666;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
        }

        .gear-btn.active {
            background: #282b30;
            color: #ff3b30;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* Volume & Power */
        .controls-row {
            width: 100%;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .volume-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #0d0e10;
            height: 8px;
            border-radius: 4px;
            outline: none;
            border: 1px solid #22252a;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #888;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            background: #ff3b30;
        }

        .power-btn {
            padding: 12px 22px;
            background: linear-gradient(145deg, #25282d, #1a1c1f);
            border: 1px solid #383c44;
            border-radius: 10px;
            color: #777;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .power-btn.active {
            color: #fff;
            border-color: #ff3b30;
            background: #ff3b30;
            box-shadow: 0 0 16px rgba(255, 59, 48, 0.6);
        }
    </style>
</head>
<body>

<div class="rack-panel">
    <!-- Ekran -->
    <div class="display">
        <div class="freq-value" id="freqDisplay">440</div>
        <div class="unit">Hz</div>
    </div>

    <!-- Kadran -->
    <div class="knob-container">
        <div class="knob-outer" id="knob">
            <div class="knob-dial" id="dial">
                <div class="pointer"></div>
            </div>
            <div class="knob-center"></div>
        </div>
    </div>

    <!-- Vitesler (3 Kademe) -->
    <div class="gear-container">
        <span class="label">Frekans Vitesi</span>
        <div class="gear-buttons">
            <button class="gear-btn" onclick="setGear(1)">1 (Low)</button>
            <button class="gear-btn active" onclick="setGear(2)">2 (Mid)</button>
            <button class="gear-btn" onclick="setGear(3)">3 (High)</button>
        </div>
    </div>

    <!-- Volume ve Power -->
    <div class="controls-row">
        <div class="volume-container">
            <span class="label">Volume</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
        <button class="power-btn" id="powerBtn" onclick="togglePower()">POWER</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;

    let currentGear = 2;
    let currentAngle = 0; // 0 - 270 derece
    const MIN_ANGLE = 0;
    const MAX_ANGLE = 270;

    // 0-22.000 Hz aralığının 3 viteslik dağılımı
    const gears = {
        1: { min: 0, max: 500 },       // Low Range
        2: { min: 500, max: 5000 },    // Mid Range
        3: { min: 5000, max: 22000 }   // High Range
    };

    const dial = document.getElementById('dial');
    const knob = document.getElementById('knob');
    const freqDisplay = document.getElementById('freqDisplay');
    const volumeSlider = document.getElementById('volume');
    const powerBtn = document.getElementById('powerBtn');

    let isDragging = false;
    let startY = 0;

    // Kadran Sürükleme Mantığı (Mouse & Touch)
    function startDrag(e) {
        isDragging = true;
        startY = e.clientY || (e.touches && e.touches[0].clientY);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', onDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
        if (!isDragging) return;
        const currentY = e.clientY || (e.touches && e.touches[0].clientY);
        const deltaY = startY - currentY;
        startY = currentY;

        currentAngle += deltaY * 1.5;
        if (currentAngle < MIN_ANGLE) currentAngle = MIN_ANGLE;
        if (currentAngle > MAX_ANGLE) currentAngle = MAX_ANGLE;

        updateUI();
    }

    function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', stopDrag);
    }

    knob.addEventListener('mousedown', startDrag);
    knob.addEventListener('touchstart', startDrag);

    function setGear(gear) {
        currentGear = gear;
        document.querySelectorAll('.gear-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === gear);
        });
        updateUI();
    }

    function updateUI() {
        dial.style.transform = `rotate(${currentAngle - 135}deg)`;

        const range = gears[currentGear];
        const freq = Math.round(range.min + (currentAngle / MAX_ANGLE) * (range.max - range.min));
        
        freqDisplay.textContent = freq;

        if (oscillator && isPlaying) {
            oscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.01);
        }
    }

    function togglePower() {
        if (!isPlaying) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            const freq = parseInt(freqDisplay.textContent);
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(volumeSlider.value, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            isPlaying = true;
            powerBtn.classList.add('active');
        } else {
            oscillator.stop();
            audioCtx.close();
            isPlaying = false;
            powerBtn.classList.remove('active');
        }
    }

    volumeSlider.addEventListener('input', (e) => {
        if (gainNode && isPlaying) {
            gainNode.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.01);
        }
    });

    updateUI();
</script>

</body>
</html>
